name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: expense_analyzer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d expense_analyzer_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ASPNETCORE_ENVIRONMENT: IntegrationTesting
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=expense_analyzer_test;Username=postgres;Password=postgres
      JwtSettings__Key: TestKeyForGithubActions_12345678901234567890
      JwtSettings__Issuer: ExpenseAnalyzerApi
      JwtSettings__Audience: ExpenseAnalyzerApiUsers
      JwtSettings__ExpirationMinutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test tests/ExpenseAnalyzer.UnitTests/ExpenseAnalyzer.UnitTests.csproj --no-build --configuration Release --logger "console;verbosity=detailed"

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Apply test database migrations
        run: dotnet ef database update --project src/ExpenseAnalyzer.Infrastructure/ExpenseAnalyzer.Infrastructure.csproj --startup-project src/ExpenseAnalyzer.Api/ExpenseAnalyzer.Api.csproj

      - name: Run integration tests
        run: dotnet test tests/ExpenseAnalyzer.IntegrationTests/ExpenseAnalyzer.IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=detailed"